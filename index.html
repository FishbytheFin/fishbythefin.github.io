<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#234d3c">
  <title>Finn’s gift registry</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main>
    <header><span class="eyebrow">A LITTLE LIST OF LOVELY THINGS</span><h1>Finn’s gift registry<span aria-hidden="true"> ✳</span></h1><p>Thank you for thinking of me. Find something you’d like to give, then mark it as purchased so everyone knows it’s covered.</p></header>
    <section aria-label="Gift registry">
      <div class="toolbar"><p id="summary">Loading gifts…</p><label><input id="available-only" type="checkbox"> Show available only</label></div>
      <p id="status" role="status" aria-live="polite">Connecting to the registry…</p>
      <div id="gifts" class="grid"></div>
      <p id="empty" hidden>No gifts to show.</p>
    </section>
    <footer>A thoughtful gift starts with you. Thank you ♡</footer>
  </main>
  <noscript>Please enable JavaScript to view gifts and their purchase status.</noscript>
  <script type="module">
    import('./app.js').catch(() => {
      document.querySelector('#status').textContent = 'The registry could not load. Check your connection and refresh to try again.';
    });
  </script>
</body>
</html>
